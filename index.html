<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愿世界和平 | Call for Peace</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 顶部英雄区 */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1528605248644-14dd04622530?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80'); /* 备用背景图：鸽子或宁静天空 */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            animation: fadeInDown 1.5s ease;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 30px;
            animation: fadeInUp 1.5s ease;
        }

        /* 呼吁口号区 */
        .manifesto {
            padding: 80px 20px;
            text-align: center;
            background: white;
        }

        .manifesto h2 {
            color: #2c3e50;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            padding: 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        /* 底部互动区 */
        .footer {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 60px 20px;
            text-align: center;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        /* 动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .hero p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>愿橄榄枝遍布每一寸土地</h1>
        <p>和平不仅是战争的缺席，更是正义的存在、生命的尊重与未来的共建。</p>
        <a href="#join" class="btn">加入和平宣言</a>
    </section>

    <section class="manifesto">
        <h2>我们的核心信念</h2>
        <div class="grid">
            <div class="card">
                <span class="icon">🕊️</span>
                <h3>相互尊重</h3>
                <p>承认文化的多样性，用对话代替对抗，用理解消除隔阂。</p>
            </div>
            <div class="card">
                <span class="icon">🤝</span>
                <h3>全球协作</h3>
                <p>面对气候、贫困与疾病，人类是命运共同体，唯有协作才能共生。</p>
            </div>
            <div class="card">
                <span class="icon">🌿</span>
                <h3>可持续发展</h3>
                <p>为子孙后代留下一个生机勃勃、没有硝烟的地球。</p>
            </div>
        </div>
    </section>

    <footer class="footer" id="join">
        <div style="max-width: 800px; margin: 0 auto;">
            <h2>传递和平的声音</h2>
            <p style="margin: 20px 0;">每一个小小的举动，都是通往持久和平的一块砖石。让我们从尊重身边的人开始。</p>
            <p><strong>#PeaceOnEarth #世界和平</strong></p>
            <br>
            <p>© 2026 愿世界永无战争</p>
        </div>
    </footer>

</body>
</html>
